<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>DevToolbox</title>
    <style>
      body {
        width: 320px;
        margin: 0;
        padding: 12px;
        font: 13px/1.4 ui-sans-serif, system-ui, sans-serif;
        color: #1e1e1e;
      }
      h1 {
        font-size: 14px;
        margin: 0 0 8px 0;
      }
      p.hint {
        color: #666;
        margin: 0 0 12px 0;
      }
      textarea {
        width: 100%;
        box-sizing: border-box;
        height: 90px;
        font: 12px ui-monospace, Consolas, monospace;
        resize: vertical;
      }
      select,
      button {
        font: 12px ui-sans-serif, system-ui, sans-serif;
        margin-top: 8px;
      }
      button {
        background: #2563eb;
        color: white;
        border: none;
        border-radius: 4px;
        padding: 6px 10px;
        cursor: pointer;
      }
      pre {
        white-space: pre-wrap;
        word-break: break-word;
        background: #f5f5f5;
        border-radius: 4px;
        padding: 8px;
        margin-top: 8px;
        max-height: 160px;
        overflow: auto;
      }
      a {
        color: #2563eb;
      }
    </style>
  </head>
  <body>
    <h1>DevToolbox</h1>
    <p class="hint">Quick tool — or select text on any page and right-click for the full menu.</p>
    <select id="tool"></select>
    <textarea id="input" placeholder="Paste text here"></textarea>
    <div>
      <button id="run">Run</button>
      <button id="copy" style="background: #444">Copy result</button>
    </div>
    <pre id="output"></pre>
    <p class="hint"><a href="https://devtoolbox.dev" target="_blank" rel="noopener">Open full DevToolbox →</a></p>
    <script src="popup.js"></script>
  </body>
</html>
