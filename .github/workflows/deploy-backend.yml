name: Deploy backend

# Runs after CI succeeds on master — a `workflow_run` trigger keyed to
# ci.yml's completion, not a bare push trigger, so a broken build/test never
# reaches production. See AUDIT_REPORT.md §24/§25.
#
# Deploys via Render's Deploy Hook (a one-time-setup, secret POST URL) rather
# than relying on Render's own auto-deploy-on-push — that way the backend
# only redeploys after this monorepo's full CI run (lint/typecheck/test/build
# across every workspace) passes, not just whatever Render's own build step
# happens to check. Turn OFF "Auto-Deploy" for the devtoolbox-api service in
# the Render dashboard so the two don't race/double-deploy — see
# PROD_READY.md's Render setup section.
on:
  workflow_run:
    workflows: ["CI"]
    branches: [master]
    types: [completed]

jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    concurrency: deploy-backend
    steps:
      - name: Trigger Render deploy
        run: curl -fsS -X POST "$RENDER_DEPLOY_HOOK_URL"
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
