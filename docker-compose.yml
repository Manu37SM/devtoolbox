name: devtoolbox

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: devtoolbox
      POSTGRES_PASSWORD: devtoolbox
      POSTGRES_DB: devtoolbox
    # Host port remapped to 5433 — 5432 conflicts with a locally-installed
    # Postgres on some dev machines (Docker Desktop's host-port forwarding
    # and a natively-running Windows service can both claim localhost:5432,
    # with inconsistent results). Update DATABASE_URL in .env to match:
    # postgresql://devtoolbox:devtoolbox@localhost:5433/devtoolbox
    ports:
      - "5433:5432"
    volumes:
      - devtoolbox_pg_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - devtoolbox_redis_data:/data

volumes:
  devtoolbox_pg_data:
  devtoolbox_redis_data:
