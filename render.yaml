# Render Blueprint — defines the backend web service and its Redis (Key
# Value) cache, all on Render's free tier, in the Oregon region.
#
# Region note: Render's Internal connection URLs (the fast/private/free
# ones — see PROD_READY.md §6) only resolve within the same region's
# private network. This app's Postgres database lives on a free instance
# shared with another app on this account (see the `databases:` note
# below), and that instance is in Oregon — so every service here that talks
# to it over an Internal URL (this web service directly, and this Redis
# instance indirectly, since the web service reaches Redis internally too)
# must also be in Oregon, or Prisma fails to connect at all (`P1001: Can't
# reach database server`) rather than just being slower. Singapore would
# otherwise be the closer region for India-based users (Render has no
# Mumbai region as of this writing — see PROD_READY.md's "Why Render"
# note), but that only matters if every service can actually reach the
# database; matching the database's region is the harder requirement.
#
# Switched from Fly.io to Render (AUDIT_REPORT.md §25) specifically because
# Fly.io no longer offers a real free tier and now requires a credit
# card after a ~2-hour trial, while Render's free web service + free
# Postgres + free Key Value require no card at all. Trade-off, disclosed in
# PROD_READY.md: free web services sleep after 15 min idle (cold start ~30-60s
# on the next request) and the free Postgres instance auto-deletes 30+14
# days after creation unless upgraded to a paid instance — genuinely
# different from Fly's "always-on" free-tier machines, not a strictly better
# swap, but the one that costs nothing.
#
# Deploy: connect this repo to Render as a Blueprint (dashboard → New →
# Blueprint → pick this repo → Render reads this file). Set every `sync:
# false` env var's real value in the Render dashboard after creation — never
# commit real secrets here. See PROD_READY.md for where to get each one.
#
# No `databases:` block here. Render's free tier allows only one active free
# Postgres *instance* per account — if you already have one backing another
# app, this Blueprint's own `devtoolbox-db` fails to create ("cannot have
# more than one active free tier database") and takes the web service down
# with it. Instead of provisioning a new instance, this app runs its own
# separate database on your existing free instance (one Postgres instance
# can host multiple independent databases with no data sharing between
# them) — `DATABASE_URL` below is `sync: false` so you paste that database's
# connection string in yourself. See PROD_READY.md §6 for the exact steps to
# create that second database and get its connection string.
services:
  - type: keyvalue
    name: devtoolbox-redis
    plan: free
    region: oregon
    maxmemoryPolicy: allkeys-lru
    ipAllowList: [] # no external access — only reachable from other Render services in this account, which is all this app needs (BullMQ jobs + rate-limit counters, both accessed only from the backend service below)

  - type: web
    name: devtoolbox-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    plan: free
    region: oregon
    healthCheckPath: /v1/health
    # No `preDeployCommand` here: that field only works on paid Render web
    # service plans — the free plan this deploys on rejects the Blueprint
    # outright if it's set ("pre-deploy command is not supported for free
    # tier services"). Instead, `npx prisma migrate deploy` runs as the
    # first step of the container's CMD (backend/Dockerfile) — safe on
    # every boot since it's a no-op once migrations are already applied.
    # If you upgrade this service to a paid plan later, moving the
    # migration back to `preDeployCommand` is a fine (optional) cleanup,
    # but leaving it in the Dockerfile CMD also continues to work fine.
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "4000"
      - key: REDIS_URL
        fromService:
          name: devtoolbox-redis
          type: keyvalue
          property: connectionString
      # Everything below is a real secret/URL you fill in via the Render
      # dashboard (Environment tab) after the Blueprint is created —
      # `sync: false` tells Render "don't manage this value, ask the human."
      # Full step-by-step for every one of these is in PROD_READY.md.
      #
      # DATABASE_URL specifically: the connection string for the second,
      # devtoolbox-only database on your existing free Postgres instance
      # (see the note above `services:` at the top of this file) — not the
      # instance's default/primary database, which belongs to whatever app
      # already uses it. As of the least-privilege DB role split
      # (DATABASE.md §6.1), this should hold the restricted `devtoolbox_app`
      # role's connection string, not the original admin role's — the app
      # process itself only ever needs SELECT/INSERT/UPDATE/DELETE.
      - key: DATABASE_URL
        sync: false
      # Only used for the one-time `prisma migrate deploy` step at container
      # start (backend/Dockerfile's CMD) — holds the *original, admin* role's
      # connection string (the one DATABASE_URL used to hold before the
      # least-privilege split), since migrations need DDL privileges the
      # restricted `devtoolbox_app` role deliberately doesn't have. Optional:
      # if unset, the Dockerfile CMD falls back to DATABASE_URL, so this is
      # only required once you've actually done the role split in
      # DATABASE.md §6.1 — leave unset until then.
      - key: MIGRATE_DATABASE_URL
        sync: false
      - key: JWT_ACCESS_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: HISTORY_ENCRYPTION_KEY
        sync: false
      - key: SSO_SECRET_ENCRYPTION_KEY
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: BACKEND_URL
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: AI_MODEL_HAIKU
        value: claude-haiku-4-5
      - key: AI_MODEL_SONNET
        value: claude-sonnet-4-5
      - key: GITHUB_OAUTH_CLIENT_ID
        sync: false
      - key: GITHUB_OAUTH_CLIENT_SECRET
        sync: false
      - key: GOOGLE_OAUTH_CLIENT_ID
        sync: false
      - key: GOOGLE_OAUTH_CLIENT_SECRET
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: SENTRY_DSN
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: RAZORPAY_PLAN_ID_PRO
        sync: false
      - key: RAZORPAY_PLAN_ID_TEAM
        sync: false
