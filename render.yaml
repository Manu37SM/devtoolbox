# Render Blueprint — defines the backend web service and its Redis (Key
# Value) cache, all on Render's free tier, in the Oregon region. Postgres is
# NOT on Render — see the Neon note below.
#
# Region note: Render's Internal connection URLs (the fast/private/free
# ones — see PROD_READY.md §6) only resolve within the same region's
# private network. Since Postgres now lives on Neon (a separate provider,
# reached over the public internet either way), this "must match the
# database's region" constraint no longer applies to Postgres — only Redis
# needs to stay in the same Render region as the web service. Pick your
# Neon project's region for lowest latency to your users instead (see
# PROD_READY.md §6 step 3).
#
# Switched from Fly.io to Render for the API/Redis (AUDIT_REPORT.md §25)
# specifically because Fly.io no longer offers a real free tier and now
# requires a credit card after a ~2-hour trial, while Render's free web
# service + free Key Value require no card at all.
#
# Postgres moved from Render to Neon (AUDIT_REPORT.md — see the dated infra
# entry) at the user's explicit direction, superseding the project's
# earlier "leave Postgres alone, use Render only" decision. Neon is
# serverless Postgres with its own free tier (no card required) and isn't
# subject to Render's one-free-Postgres-instance-per-account limit, so this
# app now gets a fully dedicated database rather than a second database
# sharing an instance with another app.
#
# Deploy: connect this repo to Render as a Blueprint (dashboard → New →
# Blueprint → pick this repo → Render reads this file). Set every `sync:
# false` env var's real value in the Render dashboard after creation — never
# commit real secrets here. See PROD_READY.md for where to get each one.
#
# No `databases:` block here — Postgres isn't a Render resource in this
# setup. `DATABASE_URL` / `MIGRATE_DATABASE_URL` below are `sync: false` so
# you paste in your Neon connection strings yourself. See PROD_READY.md §6
# for the exact Neon setup steps.
services:
  - type: keyvalue
    name: devtoolbox-redis
    plan: free
    region: oregon
    maxmemoryPolicy: allkeys-lru
    ipAllowList: [] # no external access — only reachable from other Render services in this account, which is all this app needs (BullMQ jobs + rate-limit counters, both accessed only from the backend service below)

  - type: web
    name: devtoolbox-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    plan: free
    region: oregon
    healthCheckPath: /v1/health
    # No `preDeployCommand` here: that field only works on paid Render web
    # service plans — the free plan this deploys on rejects the Blueprint
    # outright if it's set ("pre-deploy command is not supported for free
    # tier services"). Instead, `npx prisma migrate deploy` runs as the
    # first step of the container's CMD (backend/Dockerfile) — safe on
    # every boot since it's a no-op once migrations are already applied.
    # If you upgrade this service to a paid plan later, moving the
    # migration back to `preDeployCommand` is a fine (optional) cleanup,
    # but leaving it in the Dockerfile CMD also continues to work fine.
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "4000"
      - key: REDIS_URL
        fromService:
          name: devtoolbox-redis
          type: keyvalue
          property: connectionString
      # Everything below is a real secret/URL you fill in via the Render
      # dashboard (Environment tab) after the Blueprint is created —
      # `sync: false` tells Render "don't manage this value, ask the human."
      # Full step-by-step for every one of these is in PROD_READY.md.
      #
      # DATABASE_URL specifically: your Neon project's connection string
      # (PROD_READY.md §6 step 3) — use the *direct* (non-pooled) connection
      # string, not the "-pooler" one, since this is a single long-running
      # server (not serverless/edge functions juggling many short-lived
      # connections), and Prisma already pools connections internally. As
      # of the least-privilege DB role split (DATABASE.md §6.1), this
      # should hold the restricted `devtoolbox_app` role's connection
      # string, not the original admin role's — the app process itself
      # only ever needs SELECT/INSERT/UPDATE/DELETE.
      - key: DATABASE_URL
        sync: false
      # Only used for the one-time `prisma migrate deploy` step at container
      # start (backend/Dockerfile's CMD) — holds the *original, admin* role's
      # Neon connection string (the one DATABASE_URL used to hold before the
      # least-privilege split), since migrations need DDL privileges the
      # restricted `devtoolbox_app` role deliberately doesn't have. Optional:
      # if unset, the Dockerfile CMD falls back to DATABASE_URL, so this is
      # only required once you've actually done the role split in
      # DATABASE.md §6.1 — leave unset until then.
      - key: MIGRATE_DATABASE_URL
        sync: false
      - key: JWT_ACCESS_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: HISTORY_ENCRYPTION_KEY
        sync: false
      - key: SSO_SECRET_ENCRYPTION_KEY
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: BACKEND_URL
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: AI_MODEL_HAIKU
        value: claude-haiku-4-5
      - key: AI_MODEL_SONNET
        value: claude-sonnet-4-5
      - key: GITHUB_OAUTH_CLIENT_ID
        sync: false
      - key: GITHUB_OAUTH_CLIENT_SECRET
        sync: false
      - key: GOOGLE_OAUTH_CLIENT_ID
        sync: false
      - key: GOOGLE_OAUTH_CLIENT_SECRET
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: SENTRY_DSN
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: RAZORPAY_PLAN_ID_PRO
        sync: false
      - key: RAZORPAY_PLAN_ID_TEAM
        sync: false
